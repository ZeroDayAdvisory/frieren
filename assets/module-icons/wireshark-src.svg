<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" fill="#000000"/>
  <!-- Shark fin - the iconic Wireshark symbol, large and bold -->
  <path d="M38,96
           Q42,96 48,88
           Q52,82 56,68
           Q60,52 62,38
           Q63,28 66,22
           Q70,14 74,20
           Q79,30 82,46
           Q86,64 88,80
           Q90,88 94,96 Z"
        fill="#ffffff"/>
  <!-- Wave / water line below fin -->
  <path d="M18,100 Q30,92 42,100 Q54,108 66,100 Q78,92 90,100 Q102,108 114,100"
        stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Small water ripple -->
  <path d="M28,110 Q40,104 52,110 Q64,116 76,110 Q88,104 100,110"
        stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
