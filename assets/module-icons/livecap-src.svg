<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="black"/>
  <!-- Terminal window frame -->
  <rect x="10" y="18" width="108" height="80" rx="8" fill="none" stroke="white" stroke-width="8"/>
  <!-- Title bar line -->
  <line x1="10" y1="40" x2="118" y2="40" stroke="white" stroke-width="6"/>
  <!-- Terminal dot buttons -->
  <circle cx="26" cy="29" r="5" fill="white"/>
  <circle cx="42" cy="29" r="5" fill="white"/>
  <circle cx="58" cy="29" r="5" fill="white"/>
  <!-- Prompt ">" -->
  <path d="M 22 60 L 36 68 L 22 76" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Cursor/text lines -->
  <rect x="42" y="63" width="30" height="8" rx="3" fill="white"/>
  <rect x="42" y="80" width="52" height="6" rx="3" fill="white" opacity="0.6"/>
  <!-- Play/stream arrow at bottom right -->
  <path d="M 92 96 L 116 108 L 92 120" fill="white"/>
</svg>
